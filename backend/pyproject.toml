[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speakbro-backend"
version = "0.1.0"
description = "SpeakBro FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.2.1",
  "piper-tts>=1.4.2",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "supermemory-openai-sdk>=1.0.4",
  "exa-py>=1.0",
  "httpx>=0.27.0",
  "pydantic-ai>=0.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
